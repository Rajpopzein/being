services:
  - type: web
    name: being-api
    runtime: python
    plan: free
    branch: master
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port "$PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: GEMINI_API_KEY
        sync: false
